[project]
name = "kodrum"
version = "0.1.0"
description = "Vertical KO drum rating and liquid holdup check app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
